[project]
name = "vnindex-volatility-forecasting"
version = "0.1.0"
description = "Reproducible VN-Index one-step-ahead volatility forecasting pipeline."
requires-python = ">=3.10"
dependencies = [
    "arch",
    "joblib",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "requests",
    "scikit-learn",
    "statsmodels",
    "tensorflow",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
